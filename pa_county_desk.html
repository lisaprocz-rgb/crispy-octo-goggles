<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lookup of the PA Counties Workbook for Portal Pages front page: one county at a time, with cure, undeliverable and No ID guidance first.">
<meta name="robots" content="noindex,nofollow">
<title>PA County Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --ground:#F4F1E6; --surface:#FFFFFD; --surface-2:#FAF7EC; --sunk:#EDE9DA;
  --ink:#071539; --ink-2:#3C4763; --ink-3:#6F778C; --rule:#D8D3C2; --rule-2:#E7E2D3;
  --accent:#1E59D2; --accent-soft:#E6EDFB; --link:#0F5FA8;
  --alarm:#6A1217; --alarm-soft:#F6E7E6; --warn:#8A5A00; --warn-soft:#F8EEDA;
  --ok:#155E4C; --ok-soft:#E2F0EA; --neutral:#5B6478; --neutral-soft:#EAEAE2;
  --chip-ink:#FFFFFD; --band-bg:#071539; --band-ink:#FBF8EC;
  --shadow:0 1px 2px rgba(7,21,57,.07), 0 6px 18px -12px rgba(7,21,57,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#070E1E; --surface:#0E1830; --surface-2:#132039; --sunk:#0A1226;
    --ink:#EAEFF9; --ink-2:#B3BDD3; --ink-3:#8590A8; --rule:#26324D; --rule-2:#1B2540;
    --accent:#6FA0FF; --accent-soft:#16264A; --link:#7FC0FF;
    --alarm:#FF9B94; --alarm-soft:#3A1719; --warn:#F0C070; --warn-soft:#352709;
    --ok:#7FD9BE; --ok-soft:#0E2C25; --neutral:#9AA5BC; --neutral-soft:#1A2440;
    --chip-ink:#07101F; --band-bg:#17233F; --band-ink:#CFDAF0;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#070E1E; --surface:#0E1830; --surface-2:#132039; --sunk:#0A1226;
  --ink:#EAEFF9; --ink-2:#B3BDD3; --ink-3:#8590A8; --rule:#26324D; --rule-2:#1B2540;
  --accent:#6FA0FF; --accent-soft:#16264A; --link:#7FC0FF;
  --alarm:#FF9B94; --alarm-soft:#3A1719; --warn:#F0C070; --warn-soft:#352709;
  --ok:#7FD9BE; --ok-soft:#0E2C25; --neutral:#9AA5BC; --neutral-soft:#1A2440;
  --chip-ink:#07101F; --band-bg:#17233F; --band-ink:#CFDAF0;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.8);
}
html{font-size:17px}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif;
  font-size:1.031rem; line-height:1.5; -webkit-text-size-adjust:100%;
}
a{color:var(--link); overflow-wrap:anywhere}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;
}
.wrap{max-width:1180px; margin:0 auto; padding-inline:16px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:var(--surface); border-bottom:1px solid var(--rule);
}
.topbar .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding-block:10px}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto}
.brand b{font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-weight:700; font-size:1.259rem; letter-spacing:-.01em}
.brand span{font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; color:var(--ink-3)}
.views{display:flex; gap:2px; background:var(--sunk); border-radius:8px; padding:3px}
.views button{
  font:inherit; font-size:0.9375rem; font-weight:700; border:0; background:transparent; color:var(--ink-2);
  padding:6px 12px; border-radius:6px; cursor:pointer;
}
.views button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.iconbtn{
  font:inherit; font-size:0.9062rem; font-weight:700; border:1px solid var(--rule); background:var(--surface);
  color:var(--ink-2); padding:6px 10px; border-radius:6px; cursor:pointer;
}
.iconbtn:hover{border-color:var(--accent); color:var(--accent)}
.sizer{display:flex; align-items:center; gap:4px; border:1px solid var(--rule); border-radius:7px;
  background:var(--surface); padding:2px}
.sizer button{
  font:inherit; font-weight:700; border:0; background:transparent; color:var(--ink-2);
  width:34px; height:30px; border-radius:5px; cursor:pointer; line-height:1;
}
.sizer button:hover{background:var(--sunk); color:var(--accent)}
.sizer button.sm{font-size:0.9rem}
.sizer button.lg{font-size:1.15rem}
.sizer span{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; color:var(--ink-3);
  min-width:34px; text-align:center; font-variant-numeric:tabular-nums;
}

/* ---------- picker ---------- */
.picker{background:var(--surface-2); border-bottom:1px solid var(--rule)}
.picker .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding-block:12px}
.pickfield{display:flex; align-items:center; gap:8px; flex:1 1 300px; min-width:0}
.pickfield label{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; color:var(--ink-3); white-space:nowrap;
}
select#countySel{
  font:inherit; font-size:1.156rem; font-weight:700; font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif;
  flex:1 1 auto; min-width:0; padding:9px 12px; border:1px solid var(--rule); border-radius:8px;
  background:var(--surface); color:var(--ink); cursor:pointer;
}
.stepper{display:flex; gap:6px}
.stepper button{
  font:inherit; width:38px; height:38px; border:1px solid var(--rule); background:var(--surface);
  color:var(--ink-2); border-radius:8px; cursor:pointer; font-size:1.031rem; line-height:1;
}
.stepper button:hover{border-color:var(--accent); color:var(--accent)}

/* ---------- chips ---------- */
.chip{
  display:inline-flex; align-items:flex-start; gap:6px; border-radius:999px; padding:3px 10px;
  max-width:100%; white-space:normal;
  font-size:0.9rem; font-weight:700; letter-spacing:.01em;
  background:var(--neutral-soft); color:var(--ink-2); border:1px solid transparent;
}
.chip.k-alarm{background:var(--alarm-soft); color:var(--alarm)}
.chip.k-warn{background:var(--warn-soft); color:var(--warn)}
.chip.k-ok{background:var(--ok-soft); color:var(--ok)}
.chip.k-accent{background:var(--accent-soft); color:var(--accent)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; margin-top:.45em}
.chip i{font-style:normal; font-weight:400; opacity:.62; margin-right:1px}
.chip i::after{content:':'; margin-left:1px}

/* ---------- county head ---------- */
main{padding-block:22px 64px}
.chead{display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 16px; margin-bottom:14px}
.chead h1{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:clamp(1.9rem,6vw,2.7rem); font-weight:700;
  margin:0; letter-spacing:-.02em; line-height:1.05; text-wrap:balance;
}
.chead h1 em{font-style:normal; color:var(--ink-3); font-weight:700; font-size:.55em; letter-spacing:0}
.atglance{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}

/* ---------- priority band ---------- */
.band{
  background:var(--surface); border:1px solid var(--rule); border-radius:12px;
  box-shadow:var(--shadow); overflow:hidden; margin-bottom:22px;
}
.bandhead{
  display:flex; align-items:center; gap:10px; padding:9px 16px;
  background:var(--band-bg); color:var(--band-ink);
}
.bandhead h2{
  margin:0; font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; font-weight:700;
  }
.bandhead .note{margin-left:auto; font-size:0.9rem; opacity:.75}
.panels{display:grid; grid-template-columns:repeat(3,1fr)}
.panel{padding:16px 16px 14px; border-right:1px solid var(--rule-2); min-width:0}
.panel:last-child{border-right:0}
.panel .body{font-size:1.06rem}
.panel > h3{
  margin:0 0 4px; font-size:0.9375rem; font-weight:700; letter-spacing:.005em;
}
.panel .sub{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; color:var(--ink-3); margin:0 0 9px;
}
.panel .bucketline{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px}
.peers{
  font:inherit; font-size:0.9rem; font-weight:700; background:none; border:0; padding:0;
  color:var(--link); cursor:pointer; text-decoration:underline; text-underline-offset:2px;
}
.body{font-size:1rem; color:var(--ink)}
.body p{margin:0 0 8px}
.body p:last-child{margin-bottom:0}
.body ul{margin:0 0 8px; padding-left:17px}
.body li{margin-bottom:5px}
.body li:last-child{margin-bottom:0}
.body a{word-break:break-word}
.muted{color:var(--ink-3); font-style:italic}

/* ---------- contact ---------- */
.contact{
  background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:16px;
  margin-bottom:22px; display:grid; grid-template-columns:minmax(210px,0.85fr) minmax(0,1.75fr); gap:18px 28px;
}
.cgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); gap:16px 24px; align-content:start}
@media (max-width:700px){ .contact{grid-template-columns:1fr} }
.f{min-width:0}
.f .k{color:var(--ink-2);
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; color:var(--ink-3); margin-bottom:4px;
}
.f .v{font-size:1rem; word-break:break-word}
.f .v.addr{white-space:pre-line}
.f .v.big{font-size:1.156rem; font-weight:700; font-variant-numeric:tabular-nums}
.f .v.none{color:var(--ink-3); font-style:italic}

/* ---------- sections ---------- */
.secbar{display:flex; align-items:center; gap:10px; margin:0 0 10px}
.secbar h2{
  margin:0; font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; font-weight:700;
  color:var(--ink-3);
}
.secbar .rule{flex:1; height:1px; background:var(--rule)}
details.sec{
  background:var(--surface); border:1px solid var(--rule); border-radius:10px; margin-bottom:10px;
  overflow:hidden;
}
details.sec > summary{
  list-style:none; cursor:pointer; padding:13px 16px; display:flex; align-items:center; gap:10px;
  font-weight:700; font-size:1rem;
}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .caret{
  color:var(--ink-3); font-size:0.9rem; transition:transform .15s ease; flex:none; width:11px;
}
details.sec[open] > summary .caret{transform:rotate(90deg)}
details.sec > summary .count{
  margin-left:auto; font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem;
  color:var(--ink-3); font-weight:400;
}
details.sec > summary:hover{background:var(--surface-2)}
.secbody{padding:2px 16px 16px; border-top:1px solid var(--rule-2)}
.fieldrow{padding:13px 0; border-bottom:1px dashed var(--rule-2)}
.fieldrow:last-child{border-bottom:0; padding-bottom:0}
.fieldrow .k{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; color:var(--ink-3); margin-bottom:6px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.col{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; color:var(--ink-3);
  border:1px solid var(--rule); border-radius:4px; padding:0 4px; letter-spacing:.04em;
}

/* ---------- flag ---------- */
.flag{
  display:inline-flex; align-items:center; gap:5px; font-size:0.9rem; font-weight:700;
  color:var(--alarm); background:var(--alarm-soft); border-radius:4px; padding:1px 6px;
  letter-spacing:.02em; text-transform:none;
}
.flag.med{color:var(--warn); background:var(--warn-soft)}
.flag.low{color:var(--ink-2); background:var(--neutral-soft)}

/* ---------- buckets view ---------- */
.dim{margin-bottom:34px}
.dim > h2{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:1.458rem; margin:0 0 3px; letter-spacing:-.01em;
}
.dim > p.lede{margin:0 0 16px; color:var(--ink-2); font-size:0.9688rem; max-width:62ch}
.grp{
  background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:14px 16px;
  margin-bottom:9px; scroll-margin-top:150px;
}
.grp.hit{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.grphead{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 12px; margin-bottom:4px}
.grphead h3{margin:0; font-size:1.031rem; font-weight:700}
.grphead .n{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.grp p.desc{margin:0 0 11px; font-size:0.9375rem; color:var(--ink-2); max-width:70ch}
.cties{display:flex; flex-wrap:wrap; gap:5px}
.cty{
  max-width:100%; word-break:break-word;
  font:inherit; font-size:0.9062rem; border:1px solid var(--rule); background:var(--surface-2);
  color:var(--ink-2); border-radius:6px; padding:3px 9px; cursor:pointer;
}
.cty:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.cty.is-current{background:var(--accent); color:var(--chip-ink); border-color:var(--accent); font-weight:700}

/* ---------- issues view ---------- */
.ibar{display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-bottom:18px}
.ibar select,.ibar input{
  font:inherit; font-size:0.9375rem; padding:7px 10px; border:1px solid var(--rule); border-radius:7px;
  background:var(--surface); color:var(--ink); max-width:100%; min-width:0;
}
.issue{
  background:var(--surface); border:1px solid var(--rule); border-left:4px solid var(--neutral);
  border-radius:9px; padding:13px 15px; margin-bottom:9px;
}
.issue.s-High{border-left-color:var(--alarm)}
.issue.s-Medium{border-left-color:var(--warn)}
.issue.s-Low{border-left-color:var(--neutral)}
.issue .top{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-bottom:7px}
.issue .top strong{font-size:1rem}
.issue .where{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; color:var(--ink-3);
}
.issue .what{font-size:0.9688rem; margin:0 0 8px; overflow-wrap:anywhere}
.ba{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 10px; align-items:stretch}
.ba > div{display:flex; flex-direction:column; min-width:0}
.ba h4{
  margin:0 0 5px; font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem;
  font-weight:700;
}
.ba .was h4{color:var(--alarm)}
.ba .now h4{color:var(--ok)}
.ba .open h4{color:var(--warn)}
.quote{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; border-radius:7px;
  padding:9px 11px; margin:0; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;
  color:var(--ink-2);
  background:var(--sunk); border:1px solid var(--rule-2); flex:1;
}
.quote.was{background:var(--alarm-soft); border-color:transparent}
.quote.now{background:var(--ok-soft); border-color:transparent}
.quote.open{background:var(--warn-soft); border-color:transparent; font-family:inherit; font-size:0.9688rem}
.quote a{overflow-wrap:anywhere; word-break:break-word}
.quote mark{background:transparent; padding:0 1px; border-radius:2px; font-weight:700}
.quote mark.del{background:rgba(160,30,35,.22); color:var(--alarm); text-decoration:line-through;
  text-decoration-thickness:1px}
.quote mark.ins{background:rgba(21,94,76,.2); color:var(--ok)}
:root[data-theme="dark"] .quote mark.del,:root:not([data-theme="light"]) .quote mark.del{background:rgba(255,155,148,.2)}
:root[data-theme="dark"] .quote mark.ins,:root:not([data-theme="light"]) .quote mark.ins{background:rgba(127,217,190,.2)}
.issue .fix{font-size:0.9688rem; margin:0; color:var(--ink-2); overflow-wrap:anywhere}
.issue .fix b{color:var(--ink); font-weight:700}
.kindchip{
  display:inline-flex; align-items:center; gap:5px; font-size:0.9rem; font-weight:700; border-radius:4px;
  padding:1px 7px; letter-spacing:.02em;
}
.kindchip.ready{background:var(--ok-soft); color:var(--ok)}
.kindchip.confirm{background:var(--accent-soft); color:var(--accent)}
.kindchip.ask{background:var(--warn-soft); color:var(--warn)}
.kindchip.none{background:var(--neutral-soft); color:var(--ink-2)}
@media (max-width:640px){ .ba{grid-template-columns:1fr} }

details.cat{
  background:var(--surface); border:1px solid var(--rule); border-radius:11px; margin-bottom:12px;
  overflow:hidden; scroll-margin-top:120px;
}
details.cat > summary{
  list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:baseline; gap:10px;
  flex-wrap:wrap;
}
details.cat > summary::-webkit-details-marker{display:none}
details.cat > summary .caret{color:var(--ink-3); font-size:0.9rem; transition:transform .15s ease; flex:none}
details.cat[open] > summary .caret{transform:rotate(90deg)}
details.cat > summary h3{margin:0; font-size:1.13rem; font-weight:700}
details.cat > summary .n{font-size:0.95rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
details.cat > summary:hover{background:var(--surface-2)}
details.cat[open] > summary{border-bottom:1px solid var(--rule-2)}
.catbody{padding:14px 16px 16px; background:var(--surface-2)}
.catbody > p.lede{margin:0 0 14px; font-size:0.97rem; color:var(--ink-2); max-width:72ch}
.catbody .issue{background:var(--surface)}
.catbody .issue:last-child{margin-bottom:0}
.jump{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.jump button{
  font:inherit; font-size:0.9rem; border:1px solid var(--rule); background:var(--surface); color:var(--ink-2);
  border-radius:7px; padding:5px 10px; cursor:pointer;
}
.jump button:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.jump button b{font-variant-numeric:tabular-nums; margin-left:5px; color:var(--ink-3)}
.jump button.hi{border-color:var(--alarm); color:var(--alarm)}
.jump button.hi b{color:var(--alarm)}
.tally{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:20px;
}
.tallybox{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:12px 14px}
.tallybox .n{font-size:1.723rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1}
.tallybox .l{
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem; color:var(--ink-3); margin-top:5px;
}
.tallybox.hi .n{color:var(--alarm)}
.tallybox.md .n{color:var(--warn)}
.tallybox.ok .n{color:var(--ok)}

.sourcenote{
  font-size:0.9062rem; color:var(--ink-3); border-top:1px solid var(--rule); margin-top:34px;
  padding-top:14px; max-width:78ch;
}
.sourcenote code{font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Helvetica,Arial,sans-serif; font-size:0.9rem}

@media (max-width:820px){
  .panels{grid-template-columns:1fr}
  .panel{border-right:0; border-bottom:1px solid var(--rule-2)}
  .panel:last-child{border-bottom:0}
}
@media (max-width:560px){
  .brand span{display:none}
  .views button{padding:6px 9px; font-size:0.9062rem}
}
@media print{
  .topbar,.picker,.views,.iconbtn,.stepper,.peers{display:none!important}
  body{background:#fff; color:#000; font-size:11pt}
  details.sec[open],details.sec{border-color:#999}

/* ---------------- text rendering ---------------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function linkify(t){
  // markdown links first
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        (m,a,b)=>`<a href="${b}" target="_blank" rel="noopener">${a}</a>`);
  // markdown link missing a scheme (workbook defect; still make it usable)
  t = t.replace(/\[([^\]]+)\]\((www\.[^)\s]+)\)/g,
        (m,a,b)=>`<a href="https://${b}" target="_blank" rel="noopener">${a}</a>`);
  // bare urls not already inside an anchor
  t = t.replace(/(^|[\s(])((?:https?:\/\/)[^\s<)]+[^\s<).,;])/g,
        (m,pre,u)=>`${pre}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  // emails
  t = t.replace(/(^|[\s(>])([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})/g,
        (m,pre,e)=>`${pre}<a href="mailto:${e}">${e}</a>`);
  return t;
}

function render(raw){
  if(raw===null||raw===undefined||raw==='') return '<p class="muted">Not given in the workbook.</p>';
  let t = esc(raw);
  // workbook contains one raw <a href="/..."> (Lycoming). Surface the text, keep the path visible.
  t = t.replace(/&lt;a href=&quot;([^&]*?)&quot;[^&]*?&gt;(.*?)&lt;\/a&gt;/g,
        (m,href,txt)=>`${txt} (portal path ${href})`);
  const blocks = t.split(/\n\s*\n/);
  return blocks.map(b=>{
    const lines = b.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return '';
    if(lines.every(l=>/^[-•]\s/.test(l)) && lines.length){
      return '<ul>'+lines.map(l=>'<li>'+linkify(l.replace(/^[-•]\s*/,''))+'</li>').join('')+'</ul>';
    }
    if(lines.some(l=>/^[-•]\s/.test(l))){
      let out='', open=false;
      for(const l of lines){
        if(/^[-•]\s/.test(l)){ if(!open){out+='<ul>';open=true;} out+='<li>'+linkify(l.replace(/^[-•]\s*/,''))+'</li>'; }
        else { if(open){out+='</ul>';open=false;} out+='<p>'+linkify(l)+'</p>'; }
      }
      if(open) out+='</ul>';
      return out;
    }
    return '<p>'+linkify(lines.join('<br>'))+'</p>';
  }).join('');
}

function issuesFor(county, fieldKey){
  const names = FIELD_ISSUE_MAP[fieldKey] || [];
  return ISSUES.filter(i => i.county===county && names.some(n => i.field.toLowerCase().includes(n)));
}
function flagHtml(list){
  if(!list.length) return '';
  const worst = list.some(i=>i.sev==='High') ? '' : (list.some(i=>i.sev==='Medium') ? ' med' : ' low');
  const label = list.length===1 ? '1 data issue' : list.length+' data issues';
  return `<button class="flag${worst}" type="button" data-issuejump="${esc(list[0].county)}" title="See it on the Data issues tab">&#9873; ${label}</button>`;
}

let current = COUNTIES[0].county;

function chipFor(dimKey, val, glance){
  const b = BUCKETS[dimKey].groups.find(g=>g.key===val);
  if(!b) return '';
  if(glance) return `<span class="chip k-${b.tone}"><span class="dot"></span><i>${esc(BUCKETS[dimKey].short)}</i>${esc(b.glance||b.label)}</span>`;
  return `<span class="chip k-${b.tone}"><span class="dot"></span>${esc(b.label)}</span>`;
}
function peerCount(dimKey, val){
  const b = BUCKETS[dimKey].groups.find(g=>g.key===val);
  return b ? b.counties.length : 0;
}

  const o = COUNTIES.find(c=>c.county===current);

    ['b_mailing', o.b_mailing], ['b_dropbox', o.b_dropbox], ['b_satellite', o.b_satellite],

    </div>
  </div>

  <div class="secbar"><h2>Everything else</h2><div class="rule"></div></div>
  ${sections}

  <p class="sourcenote">Every field on this page is the text of the <b>PA Counties</b> front page of
  <code>PA Counties Workbook for Portal Pages</code>, shown as written. Nothing is rewritten, merged, or filled in
  from another source. Buckets and data-issue flags are added by this page; the underlying text is untouched.</p>`;
}

/* ---------------- buckets view ---------------- */
function bucketsView(){
  return Object.keys(BUCKETS).map(dim=>{
    const D = BUCKETS[dim];
    const groups = D.groups.filter(g=>g.counties.length).map(g=>`
      <div class="grp" id="grp-${dim}-${g.key}">
        <div class="grphead">
          <h3>${esc(g.label)}</h3>
          <span class="n">${g.counties.length} ${g.counties.length===1?'county':'counties'}</span>
        </div>
        <p class="desc">${esc(g.desc)}</p>
        <div class="cties">${g.counties.map(c=>`<button class="cty${c===current?' is-current':''}" type="button" data-county="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      </div>`).join('');
    return `<div class="dim"><h2>${esc(D.title)}</h2><p class="lede">${esc(D.lede)}</p>${groups}</div>`;
  }).join('') + `<p class="sourcenote">Counties are sorted into these groups by reading the workbook text for the
  column named under each heading. A county sits in exactly one group per question, so every group list on this page
  adds up to 67. Where the workbook says only &ldquo;Call BOE&rdquo;, that is its own group: it means the county has not
  published an answer, not that the answer is no.</p>`;
}

/* ---------------- issues view ---------------- */
function issuesView(){
  const hi = ISSUES.filter(i=>i.sev==='High').length;
  const md = ISSUES.filter(i=>i.sev==='Medium').length;
  const lo = ISSUES.filter(i=>i.sev==='Low').length;
  const nw = ISSUES.filter(i=>i.status.startsWith('New')).length;
  const rd = ISSUES.filter(i=>i.kind==='ready').length;
  const ak = ISSUES.filter(i=>i.kind==='ask').length;
  const counties = [...new Set(ISSUES.map(i=>i.county))].sort();
  return `
  <div class="tally">
    <div class="tallybox hi"><div class="n">${hi}</div><div class="l">High</div></div>
    <div class="tallybox md"><div class="n">${md}</div><div class="l">Medium</div></div>
    <div class="tallybox"><div class="n">${lo}</div><div class="l">Low</div></div>
    <div class="tallybox"><div class="n">${nw}</div><div class="l">New in v3</div></div>
    <div class="tallybox ok"><div class="n">${rd}</div><div class="l">Fix ready</div></div>
    <div class="tallybox"><div class="n">${ak}</div><div class="l">Ask the county</div></div>
    <div class="tallybox"><div class="n">${ISSUES.length}</div><div class="l">Total open</div></div>
  </div>
  <div class="ibar">
    <select id="fSev"><option value="">All severities</option><option>High</option><option>Medium</option><option>Low</option></select>
    <select id="fStatus"><option value="">Old and new</option><option value="Still">Carried over from 11 Sept</option><option value="New">New in this version</option></select>
    <select id="fKind"><option value="">Any kind of fix</option><option value="ready">Drop-in replacement ready</option><option value="confirm">Check the link first</option><option value="ask">Only the county can answer</option></select>
    <select id="fCounty"><option value="">All counties</option>${counties.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
    <input id="fText" type="search" placeholder="Search text" size="18">
    <button class="iconbtn" type="button" id="copyBtn">Copy list as text</button>
  </div>
  <div id="issueList"></div>
  <p class="sourcenote">Each item shows the cell as the workbook has it today next to what it should say, with the
  changed words marked. Where a whole cell is being rewritten, the left side shows the whole cell so the two read
  like for like. <b>${rd} items have a replacement ready to paste.</b> ${ak} cannot be settled from the workbook or
  the county's published pages, so the right side carries the question to put to the county instead of a guess.
  Items are grouped by the kind of problem, so no one big category can bury a small urgent one, and the four
  low-stakes groups start collapsed. The items carried over were raised on 11 September 2026 and re-checked
  against this version on 19 September: none had been applied. Severity is about what it costs a voter, so <b>High</b> means the workbook would send
  someone to the wrong place, the wrong number, or the wrong date.</p>`;
}

function paintIssues(){
  const sev = document.getElementById('fSev').value;
  const st  = document.getElementById('fStatus').value;
  const cty = document.getElementById('fCounty').value;
  const q   = document.getElementById('fText').value.trim().toLowerCase();
  const knd = document.getElementById('fKind').value;
  const list = ISSUES.filter(i =>
    (!sev || i.sev===sev) && (!st || i.status.startsWith(st)) && (!cty || i.county===cty) &&
    (!knd || i.kind===knd) &&
    (!q || (i.county+' '+i.field+' '+i.what+' '+i.now+' '+(i.should||'')+' '+i.note).toLowerCase().includes(q)));
  const el = document.getElementById('issueList');
  if(!list.length){ el.innerHTML = '<p style="color:var(--ink-3)">Nothing matches those filters.</p>'; return; }
  const KIND = {ready:'Drop-in replacement', confirm:'Check the link first',
                ask:'Only the county can answer', none:'Tracked, no change yet'};
  const card = i=>{
    const right = i.should_html
      ? `<div class="now"><h4>Should say</h4><pre class="quote now">${i.should_html}</pre></div>`
      : `<div class="open"><h4>${i.kind==='none'?'What to add' : 'No replacement to give yet'}</h4>
         <div class="quote open">${linkify(esc(i.note))}</div></div>`;
    const leftLabel = i.now && i.now.includes('Envelope Errors:') ? 'The two cells today' : 'Workbook says now';
    return `
    <article class="issue s-${i.sev}">
      <div class="top">
        <strong>${esc(i.county)}</strong>
        <span class="chip ${i.sev==='High'?'k-alarm':i.sev==='Medium'?'k-warn':''}">${i.sev}</span>
        <span class="where">${esc(i.field)}</span>
        <span class="kindchip ${i.kind}">${KIND[i.kind]}</span>
        <span class="where" style="margin-left:auto">${esc(i.status)}</span>
      </div>
      <p class="what">${esc(i.what)}</p>
      <div class="ba">
        <div class="was"><h4>${leftLabel}</h4><pre class="quote was">${i.now_html || esc(i.now) || '(blank)'}</pre></div>
        ${right}
      </div>
      ${i.should_html ? `<p class="fix"><b>Why:</b> ${linkify(esc(i.note))}</p>` : ''}
    </article>`;};

  const CLOSED = new Set(['staff','noemail','format','tracked']);
  const filtering = !!(sev || st || knd || cty || q);
  const worst = rows => rows.some(r=>r.sev==='High') ? 'High'
                      : rows.some(r=>r.sev==='Medium') ? 'Medium' : 'Low';
  const groups = CATS.map(c => ({key:c.key, title:c.title, lede:c.lede,
                                 rows:list.filter(i=>i.cat===c.key)})).filter(g=>g.rows.length);

  const jump = '<div class="jump">' + groups.map(g=>{
    const w = worst(g.rows);
    return `<button type="button" data-catjump="${g.key}" class="${w==='High'?'hi':''}">${esc(g.title)}<b>${g.rows.length}</b></button>`;
  }).join('') + '</div>';

  el.innerHTML = jump + groups.map(g=>{
    const open = filtering || !CLOSED.has(g.key);
    const w = worst(g.rows);
    return `<details class="cat" id="cat-${g.key}" ${open?'open':''}>
      <summary>
        <span class="caret">&#9654;</span>
        <h3>${esc(g.title)}</h3>
        <span class="chip ${w==='High'?'k-alarm':w==='Medium'?'k-warn':''}">${w} severity</span>
        <span class="n" style="margin-left:auto">${g.rows.length} ${g.rows.length===1?'item':'items'}</span>
      </summary>
      <div class="catbody">
        <p class="lede">${esc(g.lede)}</p>
        ${g.rows.map(card).join('')}
      </div>
    </details>`;
  }).join('');
}

function issuesAsText(){
  return ISSUES.map(i=>{
    const lines = [`[${i.sev}] ${i.county} - ${i.field}`,
                   `  Problem:     ${i.what}`,
                   `  Says now:    ${(i.now||'(blank)').replace(/\n/g,'\n               ')}`];
    if(i.should) lines.push(`  Should say:  ${i.should.replace(/\n/g,'\n               ')}`);
    else         lines.push(`  Should say:  not known yet`);
    lines.push(`  Why:         ${i.note}`);
    lines.push(`  Status:      ${i.status}`);
    return lines.join('\n');
  }).join('\n\n');
}

/* ---------------- wiring ---------------- */
const vCounty=document.getElementById('view-county'),
      vBuckets=document.getElementById('view-buckets'),
      vIssues=document.getElementById('view-issues');

function show(view, opts={}){
  for(const b of document.querySelectorAll('.views button'))
    b.setAttribute('aria-selected', String(b.dataset.view===view));
  vCounty.hidden = view!=='county';
  vBuckets.hidden = view!=='buckets';
  vIssues.hidden = view!=='issues';
  document.getElementById('pickerBar').hidden = view!=='county';
  if(view==='buckets'){
    vBuckets.innerHTML = bucketsView();
    if(opts.grp){
      const g = document.getElementById('grp-'+opts.grp.replace('|','-'));
      if(g){ g.classList.add('hit'); g.scrollIntoView({block:'center', behavior:'smooth'}); }
    }
  }
  if(view==='issues'){
    vIssues.innerHTML = issuesView();
    if(opts.county) document.getElementById('fCounty').value = opts.county;
    for(const id of ['fSev','fStatus','fKind','fCounty']) document.getElementById(id).onchange = paintIssues;
    document.getElementById('fText').oninput = paintIssues;
    document.getElementById('copyBtn').onclick = async e => {
      try{ await navigator.clipboard.writeText(issuesAsText()); e.target.textContent='Copied'; }
      catch{ e.target.textContent='Select and copy below'; }
      setTimeout(()=>{e.target.textContent='Copy list as text';},1800);
    };
    paintIssues();
  }
}

function paintCounty(){
  vCounty.innerHTML = countyView();
  document.getElementById('countySel').value = current;
  try{ localStorage.setItem('padesk.county', current); }catch(e){}
}

const sel = document.getElementById('countySel');
sel.innerHTML = COUNTIES.map(c=>`<option>${esc(c.county)}</option>`).join('');
try{ const s = localStorage.getItem('padesk.county'); if(s && COUNTIES.some(c=>c.county===s)) current = s; }catch(e){}

sel.onchange = () => { current = sel.value; paintCounty(); };
document.getElementById('prevBtn').onclick = () => step(-1);
document.getElementById('nextBtn').onclick = () => step(1);
function step(d){
  const i = COUNTIES.findIndex(c=>c.county===current);
  current = COUNTIES[(i+d+COUNTIES.length)%COUNTIES.length].county;
  paintCounty();
}
let allOpen=false;
document.getElementById('expandBtn').onclick = e => {
  allOpen=!allOpen;
  for(const d of vCounty.querySelectorAll('details.sec')) d.open = allOpen;
  e.target.textContent = allOpen ? 'Collapse all' : 'Expand all';
};
for(const b of document.querySelectorAll('.views button')) b.onclick = () => show(b.dataset.view);

document.addEventListener('click', e=>{
  const c = e.target.closest('[data-county]');
  if(c){ current = c.dataset.county; paintCounty(); show('county'); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const b = e.target.closest('[data-bucketjump]');
  if(b){ show('buckets',{grp:b.dataset.bucketjump}); return; }
  const cj = e.target.closest('[data-catjump]');
  if(cj){ const d=document.getElementById('cat-'+cj.dataset.catjump);
          if(d){ d.open=true; d.scrollIntoView({block:'start', behavior:'smooth'}); } return; }
  const j = e.target.closest('[data-issuejump]');
  if(j){ show('issues',{county:j.dataset.issuejump}); window.scrollTo({top:0,behavior:'smooth'}); }
});

const SIZES = [17,19,21,23,26,29];
let sizeIdx = 0;
function applySize(){
  document.documentElement.style.fontSize = SIZES[sizeIdx]+'px';
  document.getElementById('sizeNow').textContent = Math.round(SIZES[sizeIdx]/SIZES[0]*100)+'%';
  document.getElementById('sizeDown').disabled = sizeIdx===0;
  document.getElementById('sizeUp').disabled = sizeIdx===SIZES.length-1;
  try{ localStorage.setItem('padesk.size', String(sizeIdx)); }catch(e){}
}
try{ const v = parseInt(localStorage.getItem('padesk.size'),10);
     if(!isNaN(v) && v>=0 && v<SIZES.length) sizeIdx = v; }catch(e){}
document.getElementById('sizeUp').onclick = () => { if(sizeIdx<SIZES.length-1){sizeIdx++; applySize();} };
document.getElementById('sizeDown').onclick = () => { if(sizeIdx>0){sizeIdx--; applySize();} };
applySize();

const themeBtn = document.getElementById('themeBtn');
themeBtn.onclick = () => {
  const r = document.documentElement;
  const dark = r.getAttribute('data-theme')==='dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
  try{ localStorage.setItem('padesk.theme', r.getAttribute('data-theme')); }catch(e){}
};
try{ const t = localStorage.getItem('padesk.theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}

document.addEventListener('keydown', e=>{
  if(e.target.matches('input,select,textarea')) return;
  if(e.key==='[') step(-1);
  if(e.key===']') step(1);
});

paintCounty();
</script>

</body>
</html>
